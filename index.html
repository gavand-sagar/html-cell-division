<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cell Division 3D</title>
    <style>
        html, body {
            margin: 0; height: 100%; overflow: hidden; background: #000;
            overscroll-behavior: none;
            -webkit-user-select: none; user-select: none;
            -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
        }
        #root {
            position: fixed; inset: 0;
            background: radial-gradient(ellipse at center, #0b1a14 0%, #05060d 55%, #000 100%);
        }
        canvas { display: block; width: 100%; height: 100%; touch-action: none; }
        #hud {
            position: fixed;
            left: max(12px, env(safe-area-inset-left));
            bottom: max(12px, env(safe-area-inset-bottom));
            max-width: calc(100vw - 24px); box-sizing: border-box;
            display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
            padding: 8px 14px; border-radius: 999px;
            background: rgba(10, 18, 20, .45);
            border: 1px solid rgba(200, 255, 230, .12);
            -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
            font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace;
            color: rgba(200, 255, 230, .65); letter-spacing: .08em;
            pointer-events: none;
        }
        #hud b { color: var(--cell, #9fffd0); font-weight: 600; }
        #dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--cell, #9fffd0);
            box-shadow: 0 0 10px var(--cell, #9fffd0);
            animation: pulse 2s ease-in-out infinite;
        }
        #hint { transition: opacity .6s ease; }
        #hint.faded { opacity: .4; }
        @keyframes pulse { 50% { transform: scale(.7); opacity: .6; } }
        @media (prefers-reduced-motion: reduce) { #dot { animation: none; } }
    </style>
    <script type="importmap">
        { "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        } }
    </script>
</head>

<body>
    <div id="root"></div>
    <div id="hud"><span id="dot"></span><span>CELL <b id="cellName">—</b></span><span><span id="peers">0</span> linked</span><span id="hint"></span></div>
    <script type="module" src="./script.js"></script>
</body>

</html>
